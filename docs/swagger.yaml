openapi: 3.0.0
info:
  title: Inventory Management API
  version: 1.0.0
  description: API documentation for the Inventory Management System

paths:
  /suppliers:
    get:
      summary: Get a list of suppliers
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, name, state_code, state_name ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              name:
                type: string
              GST_No:
                type: string
              state_code:
                type: integer
              state_name:
                type: string
          description: Filter options for suppliers
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search query for supplier names, GST_No, and addresses
      responses:
        '200':
          description: A list of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
    post:
      summary: Create a new supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
  /production-logs:
    get:
      summary: Get a list of production logs
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, production_date, product_part_no, quantity_produced ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              production_date:
                type: string
                format: date
              product_part_no:
                type: integer
              quantity_produced:
                type: integer
          description: Filter options for production logs
      responses:
        '200':
          description: A list of production logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionLog'
    post:
      summary: Create a new production log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionLog'
      responses:
        '201':
          description: Production log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionLog'
  /product-scraps:
    get:
      summary: Get a list of product scraps
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ product_part_no, quantity, date, scrap_type ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              product_part_no:
                type: integer
              quantity:
                type: integer
              date:
                type: string
                format: date
              scrap_type:
                type: string
          description: Filter options for product scraps
      responses:
        '200':
          description: A list of product scraps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductScrap'
    post:
      summary: Create a new product scrap entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductScrap'
      responses:
        '201':
          description: Product scrap entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductScrap'
  /product-materials:
    get:
      summary: Get a list of product materials
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ product_part_no, material_part_no, quantity ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              product_part_no:
                type: integer
              material_part_no:
                type: integer
              quantity:
                type: integer
          description: Filter options for product materials
      responses:
        '200':
          description: A list of product materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductMaterial'
    post:
      summary: Create a new product material entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductMaterial'
      responses:
        '201':
          description: Product material entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMaterial'
  /products:
    get:
      summary: Get a list of products
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ part_no, name, unit, quantity, price, c_gst, s_gst, i_gst ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              part_no:
                type: integer
              name:
                type: string
              unit:
                type: string
              quantity:
                type: integer
              price:
                type: number
                format: float
              c_gst:
                type: number
                format: float
              s_gst:
                type: number
                format: float
              i_gst:
                type: number
                format: float
          description: Filter options for products
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search query for product names
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /material-scraps:
    get:
      summary: Get a list of material scraps
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ material_part_no, quantity, scrap_type, date ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              material_part_no:
                type: integer
              quantity:
                type: integer
              scrap_type:
                type: string
              date:
                type: string
                format: date
          description: Filter options for material scraps
      responses:
        '200':
          description: A list of material scraps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialScrap'
    post:
      summary: Create a new material scrap entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialScrap'
      responses:
        '201':
          description: Material scrap entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialScrap'
  /materials:
    get:
      summary: Get a list of materials
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ part_no, name, unit, quantity ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              part_no:
                type: integer
              name:
                type: string
              unit:
                type: string
              quantity:
                type: integer
          description: Filter options for materials
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search query for material names
      responses:
        '200':
          description: A list of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
    post:
      summary: Create a new material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Material'
      responses:
        '201':
          description: Material created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
  /challan-items:
    get:
      summary: Get a list of challan items
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, price, quantity, challan_id, material_part_no ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              price:
                type: number
                format: float
              quantity:
                type: integer
              challan_id:
                type: integer
              material_part_no:
                type: integer
          description: Filter options for challan items
      responses:
        '200':
          description: A list of challan items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChallanItem'
    post:
      summary: Create a new challan item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallanItem'
      responses:
        '201':
          description: Challan item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallanItem'
  /challans:
    get:
      summary: Get a list of challans
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, challan_no, supplier_id, total_price, date ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              challan_no:
                type: integer
              supplier_id:
                type: integer
              total_price:
                type: number
                format: float
              date:
                type: string
                format: date
          description: Filter options for challans
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search query for challan remarks
      responses:
        '200':
          description: A list of challans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challan'
    post:
      summary: Create a new challan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Challan'
      responses:
        '201':
          description: Challan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challan'
  /buyers:
    get:
      summary: Get a list of buyers
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, name, state_code, state_name ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              name:
                type: string
              GST_No:
                type: string
              state_code:
                type: integer
              state_name:
                type: string
          description: Filter options for buyers
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search query for buyer names, GST_No, and addresses
      responses:
        '200':
          description: A list of buyers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Buyer'
    post:
      summary: Create a new buyer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Buyer'
      responses:
        '201':
          description: Buyer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
  /bill-items:
    get:
      summary: Get a list of bill items
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, quantity, price, c_gst, s_gst, i_gst, bill_id, product_part_no ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              quantity:
                type: integer
              price:
                type: number
                format: float
              c_gst:
                type: number
                format: float
              s_gst:
                type: number
                format: float
              i_gst:
                type: number
                format: float
              bill_id:
                type: integer
              product_part_no:
                type: integer
          description: Filter options for bill items
      responses:
        '200':
          description: A list of bill items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillItem'
    post:
      summary: Create a new bill item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillItem'
      responses:
        '201':
          description: Bill item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillItem'
  /bills:
    get:
      summary: Get a list of bills
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, buyer_id, total_price, date, purchase_order ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              buyer_id:
                type: integer
              total_price:
                type: number
                format: float
              date:
                type: string
                format: date
              purchase_order:
                type: string
          description: Filter options for bills
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search query for bill remarks
      responses:
        '200':
          description: A list of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'
    post:
      summary: Create a new bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bill'
      responses:
        '201':
          description: Bill created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
  /audit-logs:
    get:
      summary: Get a list of audit logs
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [ id, table_name, table_primary_key, column_name, old_value, new_value, username, change_timestamp, action_type ]
          description: Column to sort by
        - name: filter
          in: query
          required: false
          schema:
            type: object
            properties:
              table_name:
                type: string
              table_primary_key:
                type: string
              column_name:
                type: string
              old_value:
                type: string
              new_value:
                type: string
              username:
                type: string
              change_timestamp:
                type: string
                format: date-time
              action_type:
                type: string
          description: Filter options for audit logs
      responses:
        '200':
          description: A list of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'

components:
  schemas:
    Supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        GST_No:
          type: string
        state_code:
          type: integer
        state_name:
          type: string
        address:
          type: string
    ProductionLog:
      type: object
      properties:
        id:
          type: integer
        production_date:
          type: string
          format: date
        product_part_no:
          type: integer
        quantity_produced:
          type: integer
    ProductScrap:
      type: object
      properties:
        product_part_no:
          type: integer
        quantity:
          type: integer
        date:
          type: string
          format: date
        scrap_type:
          type: string
    ProductMaterial:
      type: object
      properties:
        product_part_no:
          type: integer
        material_part_no:
          type: integer
        quantity:
          type
