<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
</head>
<body>
<h1>User List</h1>
<ul>
    {% for user in users %}
        <li>username: {{ user.Username }}</li>
        <li>password: {{ user.password }}</li>
        <li>user type: {{ user.user_type }}</li>
    {% endfor %}
</ul>
</body>
</html>
