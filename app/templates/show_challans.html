{% extends "base.html" %}
{% block head %}
    <meta charset="UTF-8">
    <meta supplier_id="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challan Data Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 25px;
            overflow: hidden;
            border-bottom: 5px solid grey;
        }

        th, td {
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th:first-child {
            border-top-left-radius: 25px;
        }

        th:last-child {
            border-top-right-radius: 25px;
        }

        tr:last-child td:first-child {
            border-bottom-left-radius: 25px;
        }

        tr:last-child td:last-child {
            border-bottom-right-radius: 25px;
        }

        th {
            background-color: #d0f0ff;
            cursor: pointer;
            position: relative;
        }

        th .sort-icon {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            padding-top: 5px;
        }

        .sort-icon.active {
            border: 1px solid blue; /* Add blue border */
            border-radius: 10px;
        }

        .checkbox-column {
            width: 5%;
            text-align: center;
            cursor: default;
        }

        .challan-column {
            width: 20%;
            cursor: default;
        }

        .supplier-column {
            width: 20%;
        }

        .price-column {
            width: 10%;
        }

        .date-column {
            width: 10%;
        }

        remarks-column{
            width: 30%;
        }

        .actions-column {
            width: 5%;
            text-align: center;
            cursor: default;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination button {
            padding-top: 6px;
            margin: 0 5px;
            cursor: pointer;
            background: none;
            border: none;
            color: #0d6efd;
        }

        .pagination button.disabled {
            color: #c0c0c0;
            cursor: not-allowed;
        }

        .pagination .page-number {
            margin: 0;
            font-size: 16px;
        }

        .pagination i {
            font-size: 24px;
            cursor: pointer;
        }

        .actions-column i {
            font-size: 100%;
            cursor: pointer;
        }

        .lni-pencil {
            color: blue;
        }

        .lni-trash-can {
            color: red;
        }

        .actions-column i:hover {
            color: gray;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 2px solid gray;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .filter-container {
            display: flex;
            gap: 10px;
        }

        .filter-container input,
        .filter-container select,
        .filter-container button {
            outline: none;
            border: 1px solid gray;
            border-radius: 20px;
            padding: 5px;
        }

        .filter-container button {
            color: white;
            background-color: #17365a;
        }

        #minPrice {
            width: 105px;
        }

        #maxPrice {
            width: 105px;
        }

        .searchbar {
            border: 1px solid gray;
            border-radius: 25px;
        }

        .searchbar input {
            outline: none;
            border: 0;
            border-radius: 25px;
        }

        .searchbar select {
            width: 50px;
            outline: none;
            border: 0;
            border-left: 1px solid gray;
            margin-right: 5px;
        }

        .button-container button {
            padding: 5px 10px;
            margin-left: 10px;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
        }

        .button-container button {
            margin-left: 10px;
            padding: 5px 10px;
            cursor: pointer;
            background-color: #17365a;
            color: white;
            border: none;
            border-radius: 15px;
        }

        #searchInput{
            width: 210px;
        }

        .button-container #addBtn:hover {
            transition: background-color 300ms;
            background-color: #63be63;
        }

        .button-container #delBtn:hover {
            transition: background-color 300ms;
            background-color: red;
        }

    </style>
{% endblock %}

{% block content %}
    <div class="container" style="margin-left: 30px">
        <h2>Challan Data</h2>

        <!-- Wrapper for search bar and buttons -->
        <div class="top-bar">
            <div class="filter-container">
                <div class="searchbar">
                    <input type="text" id="searchInput" placeholder="Search Challan no. or Supplier ID..." oninput="fetchData(1)">
                    <select id="searchFilter" onchange="fetchData(1)">
                        <option value="">All</option>
                        <option value="supplier_id">Supplier ID</option>
                        <option value="challan_no">Challan Number</option>
                    </select>
                </div>
                <a>Date Range: <input type="date" id="startDate" placeholder="Start Date" oninput="fetchData(1)">-<input type="date" id="endDate" placeholder="End Date" oninput="fetchData(1)"></a>
                <a>Price: <input type="number" id="minPrice" placeholder="Min Price" oninput="fetchData(1)">
                    <input type="number" id="maxPrice" placeholder="Max Price" oninput="fetchData(1)"></a>
                <button onclick="clearFilters()">Clear Filters</button>
            </div>
            <div class="button-container">
                <button id="delBtn" onclick="deleteSelected()">Delete Selected</button>
            </div>
        </div>

        <table id="dataTable" class="table table-hover">
            <thead class="table-light" style="border-color: black; border-width: 2px">
            <tr>
                <th class="checkbox-column"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                <th class="challan-no-column">Challan No</th>
                <th class="supplier-id-column" data-sort-by="supplier_id" onclick="sortTable(this)">Supplier Name <span class="sort-icon"></span></th>
                <th class="date-column" data-sort-by="date" onclick="sortTable(this)">Date <span class="sort-icon"></span></th>
                <th class="total-price-column" data-sort-by="total_price" onclick="sortTable(this)">Total Price <span class="sort-icon"></span></th>
                <th class="remarks-column" data-sort-by="remarks" onclick="sortTable(this)">Remarks <span class="sort-icon"></span></th>
                <th class="actions-column">Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rows will be inserted here dynamically -->
            </tbody>
        </table>

        <div class="pagination" id="pagination">
            <!-- Pagination buttons will be inserted here dynamically -->
        </div>

        <div class="modal fade" id="addChallanModal" tabindex="-1" aria-labelledby="addChallanModalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addChallanModalLabel">Add New Challan</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addChallanForm">
                            <div class="mb-3">
                                <label for="challanNo" class="form-label">Challan No</label>
                                <input type="text" class="form-control" id="challanNo" name="challan_no" required>
                            </div>
                            <div class="mb-3">
                                <label for="supplierName" class="form-label">Supplier Name</label>
                                <input type="text" class="form-control" id="supplierName" name="supplier_name" required>
                            </div>
                            <div class="mb-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" name="date" required>
                            </div>
                            <div class="mb-3">
                                <label for="totalPrice" class="form-label">Total Price</label>
                                <input type="number" class="form-control" id="totalPrice" name="total_price" required>
                            </div>
                            <div class="mb-3">
                                <label for="remarks" class="form-label">Remarks</label>
                                <input type="text" class="form-control" id="remarks" name="remarks">
                            </div>
                            <button type="submit" class="btn btn-primary" id="submitBtn">Add Challan</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Material details modal -->
        <div class="modal fade" id="materialDetailsModal" tabindex="-1" aria-labelledby="materialDetailsModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="materialDetailsModalLabel">Material Details for Challan No: <span id="challanNoModal"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Material Name</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody id="materialDetailsTableBody">
                                <!-- Material details will be inserted here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentPage = 1;
        let currentSortBy = 'supplier_id';
        let currentSortOrder = 'asc';
        let sortOrders = {'supplier_id': 'asc', 'challan_no': 'asc', 'date': 'asc', 'total_price': 'asc', 'remarks': 'asc'};
        let editChallanID = null; // Global variable to store the challan ID being edited
        let selectedItems = []; // Global variable to store selected item IDs


        async function fetchData(page, sortBy = 'supplier_id', sortOrder = 'asc') {
            try {
                const searchQuery = document.getElementById('searchInput').value;
                const searchFilter = document.getElementById('searchFilter').value;
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const minPrice = document.getElementById('minPrice').value;
                const maxPrice = document.getElementById('maxPrice').value;

                const queryParams = new URLSearchParams({
                    sort_order: sortOrder,
                    sort_by: sortBy,
                    page: page,
                    page_size: 10,
                });

                if (searchQuery) {
                    if (searchFilter) {
                        queryParams.append(searchFilter, searchQuery);
                    } else {
                        queryParams.append('search', searchQuery);
                    }
                }
                if (startDate) {
                    queryParams.append('start_date', startDate);
                }
                if (endDate) {
                    queryParams.append('end_date', endDate);
                }
                if (minPrice) {
                    queryParams.append('min_total_price', minPrice);
                }
                if (maxPrice) {
                    queryParams.append('max_total_price', maxPrice);
                }

                const response = await fetch(`/api/v1/challans?${queryParams.toString()}`);
                const data = await response.json();
                const pagination = JSON.parse(response.headers.get('x-pagination'));

                populateTable(data);
                setupPagination(pagination);
                updateSortIcons();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // Function to clear filters
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchFilter').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            fetchData(1);
        }

        async function showMaterialDetails(challanNo) {
            try {
                // Fetch all challans
                const response = await fetch(`/api/v1/challans`);
                const data = await response.json();

                console.log('Fetched challans:', data); // Debugging: log fetched data

                // Find the challan with the given challan_no
                const challan = data.find(item => item.challan_no === challanNo);

                if (!challan) {
                    console.error(`Challan with challan_no ${challanNo} not found.`);
                    return;
                }

                console.log('Found challan:', challan); // Debugging: log found challan

                document.getElementById('challanNoModal').textContent = challanNo;

                const materialDetailsTableBody = document.getElementById('materialDetailsTableBody');
                materialDetailsTableBody.innerHTML = '';

                challan.challan_items.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.material.name}</td>
                        <td>${item.quantity}</td>
                        <td>${item.price}</td>
                    `;
                    materialDetailsTableBody.appendChild(row);
                });

                // Show the modal
                const modal = new bootstrap.Modal(document.getElementById('materialDetailsModal'));
                modal.show();
            } catch (error) {
                console.error('Error fetching material details:', error);
            }
        }


        function populateTable(data) {
            const tableBody = document.getElementById('dataTable').getElementsByTagName('tbody')[0];

            // Clear existing rows
            tableBody.innerHTML = '';

            data.forEach(item => {
                const row = tableBody.insertRow();
                const cellCheckbox = row.insertCell(0);
                const cellChallanNo = row.insertCell(1);
                const cellSupplierName = row.insertCell(2);
                const cellDate = row.insertCell(3);
                const cellTotalPrice = row.insertCell(4);
                const cellRemarks = row.insertCell(5);
                const cellActions = row.insertCell(6);

                // Store item ID or unique identifier (item.challan_id in this case) in the checkbox
                cellCheckbox.innerHTML = `<input type="checkbox" class="rowCheckbox" data-id="${item.id}" style="margin-left: 35%">`;
                cellChallanNo.innerHTML = `<a href="javascript:void(0)" onclick="showMaterialDetails(${item.challan_no})">${item.challan_no}</a>`;
                cellSupplierName.textContent = item.supplier.name;
                cellDate.textContent = item.date;
                cellTotalPrice.textContent = item.total_price;
                cellRemarks.textContent = item.remarks;
                cellActions.innerHTML = `
                    <i class="lni lni-pencil" onclick="editRow(${item.id})" style="padding-right: 2px"></i>
                    <i class="lni lni-trash-can" onclick="deleteRow(${item.challan_no})" style="padding-left: 2px"></i>
                `;
                cellActions.className = "actions-column";

                // Check if this row's checkbox should be initially checked based on stored selection
                if (selectedItems.includes(item.challan_no)) {
                    cellCheckbox.firstChild.checked = true;
                }
            });
        }


        function handleCheckboxClick(checkbox) {
            const itemId = checkbox.getAttribute('data-id');

            if (checkbox.checked && !selectedItems.includes(itemId)) {
                selectedItems.push(itemId); // Add item ID to selectedItems if checkbox is checked
            } else if (!checkbox.checked) {
                selectedItems = selectedItems.filter(item => item !== itemId); // Remove item ID if checkbox is unchecked
            }
        }


        function setupPagination(pagination) {
            const paginationDiv = document.getElementById('pagination');

            // Clear existing buttons
            paginationDiv.innerHTML = '';

            const prevButton = document.createElement('button');
            prevButton.innerHTML = '<i class="peepo lni lni-chevron-left"></i>';
            if (pagination.page > 1) {
                prevButton.onclick = () => fetchData(pagination.page - 1, currentSortBy, currentSortOrder);
                prevButton.classList.remove('disabled');
            } else {
                prevButton.classList.add('disabled');
            }
            paginationDiv.appendChild(prevButton);

            const pageNumber = document.createElement('span');
            pageNumber.className = 'page-number';
            pageNumber.textContent = `Page ${pagination.page} of ${pagination.total_pages}`;
            paginationDiv.appendChild(pageNumber);

            const nextButton = document.createElement('button');
            nextButton.innerHTML = '<i class="peepo lni lni-chevron-right"></i>';
            if (pagination.page < pagination.total_pages) {
                nextButton.onclick = () => fetchData(pagination.page + 1, currentSortBy, currentSortOrder);
                nextButton.classList.remove('disabled');
            } else {
                nextButton.classList.add('disabled');
            }
            paginationDiv.appendChild(nextButton);
        }


        function sortTable(header) {
            const sortBy = header.dataset.sortBy;
            const sortOrder = sortOrders[sortBy] === 'asc' ? 'desc' : 'asc';
            currentSortBy = sortBy;
            currentSortOrder = sortOrder;
            sortOrders[sortBy] = sortOrder;

            fetchData(currentPage, sortBy, sortOrder);
        }

        function updateSortIcons() {
            const headers = document.querySelectorAll('th[data-sort-by]');
            headers.forEach(header => {
                const sortBy = header.getAttribute('data-sort-by');
                const sortIconElem = header.querySelector('.sort-icon');

                // Remove 'active' class and set all icons to default state
                sortIconElem.innerHTML = `<i class="lni lni-chevron-up"></i>`;
                sortIconElem.classList.remove('active');

                // Set active state and apply blue border
                if (sortBy === currentSortBy) {
                    const icon = currentSortOrder === 'asc' ? '<i class="lni lni-chevron-up"></i>' : '<i class="lni lni-chevron-down"></i>';
                    sortIconElem.innerHTML = icon;
                    sortIconElem.classList.add('active');
                }
            });
        }

        // Event listener for the checkbox
        document.getElementById('dataTable').addEventListener('change', function (event) {
            if (event.target.classList.contains('rowCheckbox')) {
                const itemId = event.target.getAttribute('data-id');

                if (event.target.checked) {
                    selectedItems.push(itemId);
                } else {
                    const index = selectedItems.indexOf(itemId);
                    if (index !== -1) {
                        selectedItems.splice(index, 1);
                    }
                }

                console.log('Selected items:', selectedItems);
            }
        });


        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const rowCheckboxes = document.querySelectorAll('.rowCheckbox');

            rowCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
                handleCheckboxClick(checkbox); // Call handleCheckboxClick for each checkbox
            });
        }

        document.addEventListener('change', function (event) {
            if (event.target.classList.contains('rowCheckbox')) {
                handleCheckboxClick(event.target); // Call handleCheckboxClick for individual checkboxes
            }
        });

        function editRow(challan_id) {
        // Fetch data for the selected challan number
            fetch(`/api/v1/challans/${challan_id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Opening edit modal');
                    // Populate modal form fields with fetched data
                    document.getElementById('challanNo').value = data.challan_no;
                    document.getElementById('supplierName').value = data.supplier_id;
                    document.getElementById('date').value = data.date;
                    document.getElementById('totalPrice').value = data.total_price;
                    document.getElementById('remarks').value = data.remarks;

                    // Store challan no for PUT request
                    editChallanID = challan_id;

                    // Change modal title and button label for editing
                    document.getElementById('addChallanModalLabel').textContent = 'Edit Challan';
                    document.getElementById('submitBtn').textContent = 'Update Challan';

                    // Show the modal
                    openEditModal();
                })
                .catch(error => console.error('Error fetching challan details:', error));
        }


        // Function to open Bootstrap modal for editing
        function openEditModal() {
            console.log('Opening edit modal');
            const modal = new bootstrap.Modal(document.getElementById('addChallanModal'));
            modal.show();
        }

        async function deleteRow(challanNo) {
            if (confirm(`Are you sure you want to delete part no ${challanNo}?`)) {
                try {
                    await fetch(`/api/v1/challans/${challanNo}`, {
                        method: 'DELETE',
                    });
                    fetchData(currentPage, currentSortBy, currentSortOrder);
                } catch (error) {
                    console.error('Error deleting row:', error);
                }
            }
        }

        function openModal() {
            const modal = new bootstrap.Modal(document.getElementById('addMaterialModal'));
            modal.show();

            // Clear form fields and reset modal properties
            document.getElementById('addChallanForm').reset(); // Clear form fields
            document.getElementById('challanNo').disabled = false;
            document.getElementById('supplierName').disabled = false; // Enable the unit dropdown
            editChallanID = null; // Reset editChallanID
            document.getElementById('addChallanModalLabel').textContent = 'Add New Material'; // Reset modal title
            document.getElementById('submitBtn').textContent = 'Add Material'; // Reset submit button label
        }

        // Function to close Bootstrap modal and reset its state
        function closeModal() {
            const modalElement = document.getElementById('addMaterialModal');
            const modal = bootstrap.Modal.getInstance(modalElement); // Get the instance of the modal
            modal.hide(); // Hide the modal using Bootstrap's hide method

            // Reset form fields and modal properties
            document.getElementById('addChallanForm').reset(); // Reset form fields
            document.getElementById('materialUnit').disabled = false; // Enable the unit dropdown
            editChallanID = null; // Reset editChallanID
            document.getElementById('addChallanModalLabel').textContent = 'Add New Material'; // Reset modal title
            document.getElementById('submitBtn').textContent = 'Add Material'; // Reset submit button label
        }



        async function deleteSelected() {
            if (selectedItems.length === 0) {
                alert('No rows selected');
                return;
            }

            if (confirm(`Are you sure you want to delete selected rows?`)) {
                try {
                    await Promise.all(selectedItems.map(challanNo =>
                        fetch(`/api/v1/challans/${challanNo}`, {
                            method: 'DELETE',
                        })
                    ));
                    selectedItems = []; // Clear selectedItems array after successful deletion
                    fetchData(currentPage, currentSortBy, currentSortOrder); // Refresh data table after deletion
                } catch (error) {
                    console.error('Error deleting selected rows:', error);
                }
            }
        }


        // Function to handle form submission for both add and edit
         document.getElementById('addChallanForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const challan_no = formData.get('challan_no');
            const supplier_id = formData.get('supplier_id');
            const date = formData.get('date');
            const total_price = formData.get('total_price');
            const remarks = formData.get('remarks');

            const data = {
                challan_no: challan_no,
                supplier_id: supplier_id,
                date: date,
                total_price: total_price,
                remarks: remarks
            };

            try {
                if (editChallanID) {
                    // If editChallanID is set, send a PUT request to update the challan
                    await fetch(`/api/v1/challans/${editChallanID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });
                    editChallanID = null; // Reset editChallanID after successful update
                } else {
                    // Otherwise, it's a POST request to add a new challan
                    await fetch('/api/v1/challans', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });
                }
                const modal = bootstrap.Modal.getInstance(document.getElementById('addChallanModal'));
                modal.hide(); // Close modal on successful submission
                fetchData(currentPage, currentSortBy, currentSortOrder); // Fetch updated data
            } catch (error) {
                console.error('Error adding/updating challan:', error);
            }
        });

        // Initial fetch
        fetchData(currentPage);
    </script>
{% endblock %}
