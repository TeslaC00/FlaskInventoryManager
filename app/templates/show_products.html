{% extends "base.html" %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Data Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 25px;
            overflow: hidden;
            border-bottom: 5px solid grey;
        }

        th, td {
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th:first-child {
            border-top-left-radius: 25px;
        }

        th:last-child {
            border-top-right-radius: 25px;
        }

        tr:last-child td:first-child {
            border-bottom-left-radius: 25px;
        }

        tr:last-child td:last-child {
            border-bottom-right-radius: 25px;
        }

        th {
            background-color: #d0f0ff;
            cursor: pointer;
            position: relative;
        }

        th .sort-icon {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            padding-top: 5px;
        }

        .sort-icon.active {
            border: 1px solid blue; /* Add blue border */
            border-radius: 10px;
        }

        .checkbox-column {
            width: 5%;
            text-align: center;
            cursor: default;
        }

        .part-no-column {
            width: 10%;
            cursor: default;
        }

        .name-column {
            width: 15%;
        }

        .quantity-column {
            width: 10%;
        }

        .unit-column {
            width: 10%;
        }

        .gst-column {
            width: 10%;
        }

        .actions-column {
            width: 5%;
            text-align: center;
            cursor: default;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination button {
            padding-top: 6px;
            margin: 0 5px;
            cursor: pointer;
            background: none;
            border: none;
            color: #0d6efd;
        }

        .pagination button.disabled {
            color: #c0c0c0;
            cursor: not-allowed;
        }

        .pagination .page-number {
            margin: 0;
            font-size: 16px;
        }

        .pagination i {
            font-size: 24px;
            cursor: pointer;
        }

        .actions-column i {
            font-size: 100%;
            cursor: pointer;
        }

        .lni-pencil {
            color: blue;
        }

        .lni-trash-can {
            color: red;
        }

        .actions-column i:hover {
            color: gray;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 2px solid gray;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .filter-container {
            display: flex;
            gap: 10px;
        }

        .filter-container input,
        .filter-container select,
        .filter-container button {
            outline: none;
            border: 1px solid gray;
            border-radius: 20px;
            padding: 5px;
        }

        .filter-container button {
            color: white;
            background-color: #17365a;
        }

        #minQuantity {
            width: 60px;
        }

        #maxQuantity {
            width: 60px;
        }

        .searchbar {
            border: 1px solid gray;
            border-radius: 25px;
        }

        .searchbar input {
            outline: none;
            border: 0;
            border-radius: 25px;
        }

        .searchbar select {
            width: 122px;
            outline: none;
            border: 0;
            border-left: 1px solid gray;
            margin-right: 5px;
        }

        .button-container button {
            padding: 5px 10px;
            margin-left: 10px;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
        }

        .button-container button {
            margin-left: 10px;
            padding: 5px 10px;
            cursor: pointer;
            background-color: #17365a;
            color: white;
            border: none;
            border-radius: 15px;
        }

        .button-container #addBtn:hover {
            transition: background-color 300ms;
            background-color: #63be63;
        }

        .button-container #delBtn:hover {
            transition: background-color 300ms;
            background-color: red;
        }

    </style>
{% endblock %}

{% block content %}
    <div class="container" style="margin-left: 30px">
        <h2>Product Data</h2>

        <!-- Wrapper for search bar and buttons -->
        <div class="top-bar">
            <div class="filter-container">
                <div class="searchbar">
                    <input type="text" id="searchInput" placeholder="Search by name... " oninput="fetchData(1)">
                    <select id="unitFilter" onchange="fetchData(1)">
                        <option value="">All Units</option>
                        <option value="gram">Gram</option>
                        <option value="centimeter">Centimeter</option>
                        <option value="piece">Piece</option>
                    </select>
                </div>
                <a>Quantity: <input type="number" min="0" id="minQuantity" placeholder="Min" oninput="fetchData(1)">
                    <input type="number" min="0" id="maxQuantity" placeholder="Max" oninput="fetchData(1)"></a>
                <button onclick="clearFilters()">Clear Filters</button>
            </div>
            <div class="button-container">
                <button id="addBtn" onclick="openModal()">Add New Product</button>
                <button id="delBtn" onclick="deleteSelected()">Delete Selected</button>
            </div>
        </div>

        <table id="dataTable" class="table table-hover">
            <thead class="table-light" style="border-color: black; border-width: 2px">
            <tr>
                <th class="checkbox-column"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                <th class="part-no-column">Part No</th>
                <th class="name-column" data-sort-by="name" onclick="sortTable(this)">Name <span
                        class="sort-icon"></span>
                </th>
                <th class="quantity-column" data-sort-by="quantity" onclick="sortTable(this)">Quantity <span
                        class="sort-icon"></span></th>
                <th class="unit-column" data-sort-by="unit" onclick="sortTable(this)">Unit <span
                        class="sort-icon"></span>
                </th>
                <th class="gst-column" data-sort-by="c_gst" onclick="sortTable(this)">C GST <span
                        class="sort-icon"></span></th>
                <th class="gst-column" data-sort-by="s_gst" onclick="sortTable(this)">S GST <span
                        class="sort-icon"></span></th>
                <th class="gst-column" data-sort-by="i_gst" onclick="sortTable(this)">I GST <span
                        class="sort-icon"></span></th>
                <th class="price-column" data-sort-by="price" onclick="sortTable(this)">Price <span
                        class="sort-icon"></span></th>
                <th class="actions-column">Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rows will be inserted here dynamically -->
            </tbody>
        </table>

        <div class="pagination" id="pagination">
            <!-- Pagination buttons will be inserted here dynamically -->
        </div>

        <!-- Add Material Modal -->
        <div class="modal fade" id="addMaterialModal" tabindex="-1" aria-labelledby="addMaterialModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addMaterialModalLabel">Add New Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addMaterialForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="materialName" class="form-label">Product Name</label>
                                    <input type="text" class="form-control" id="materialName" name="name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="materialUnit" class="form-label">Unit Type</label>
                                    <select class="form-select" id="materialUnit" name="unit" required>
                                        <option value="gram">Gram</option>
                                        <option value="centimeter">Centimeter</option>
                                        <option value="piece">Piece</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="materialQuantity" class="form-label">Quantity</label>
                                    <input type="number" class="form-control" id="materialQuantity" name="quantity" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="materialPrice" class="form-label">Price</label>
                                    <input type="number" class="form-control" id="materialPrice" name="price" step="0.01" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="materialCGST" class="form-label">C-GST (%)</label>
                                    <input type="number" class="form-control" id="materialCGST" name="c_gst" step="0.01" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="materialSGST" class="form-label">S-GST (%)</label>
                                    <input type="number" class="form-control" id="materialSGST" name="s_gst" step="0.01" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="materialIGST" class="form-label">I-GST (%)</label>
                                    <input type="number" class="form-control" id="materialIGST" name="i_gst" step="0.01" required>
                                </div>
                            </div>
                            <button id='submitBtn' type="submit" class="btn btn-primary">Add Product</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentPage = 1;
        let currentSortBy = 'name';
        let currentSortOrder = 'asc';
        let sortOrders = { 'name': 'asc', 'quantity': 'asc', 'unit': 'asc' };
        let editPartNo = null; // Global variable to store the part number being edited
        let selectedItems = []; // Global variable to store selected item IDs

        async function fetchData(page, sortBy = 'name', sortOrder = 'asc') {
            try {
                const searchQuery = document.getElementById('searchInput').value;
                const unitFilter = document.getElementById('unitFilter').value;
                const minQuantity = document.getElementById('minQuantity').value;
                const maxQuantity = document.getElementById('maxQuantity').value;

                const queryParams = new URLSearchParams({
                    sort_order: sortOrder,
                    sort_by: sortBy,
                    page: page,
                    page_size: 11,
                });

                if (searchQuery) {
                    queryParams.append('search', searchQuery);
                }
                if (unitFilter) {
                    queryParams.append('unit', unitFilter);
                }
                if (minQuantity) {
                    queryParams.append('min_quantity', minQuantity);
                }
                if (maxQuantity) {
                    queryParams.append('max_quantity', maxQuantity);
                }

                const response = await fetch(`/api/v1/product?${queryParams.toString()}`);
                const data = await response.json();
                const pagination = JSON.parse(response.headers.get('x-pagination'));

                populateTable(data);
                setupPagination(pagination);
                updateSortIcons();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // Function to clear filters
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('unitFilter').value = '';
            document.getElementById('minQuantity').value = '';
            document.getElementById('maxQuantity').value = '';
            fetchData(1);
        }

        function populateTable(data) {
            const tableBody = document.getElementById('dataTable').getElementsByTagName('tbody')[0];

            // Clear existing rows
            tableBody.innerHTML = '';

            data.forEach(item => {
                const row = tableBody.insertRow();
                const cellCheckbox = row.insertCell(0);
                const cellPartNo = row.insertCell(1);
                const cellName = row.insertCell(2);
                const cellQuantity = row.insertCell(3);
                const cellUnit = row.insertCell(4);
                const cellCGST = row.insertCell(5);
                const cellSGST = row.insertCell(6);
                const cellIGST = row.insertCell(7);
                const cellPrice = row.insertCell(8);
                const cellActions = row.insertCell(9);

                // Store item ID or unique identifier (item.part_no in this case) in the checkbox
                cellCheckbox.innerHTML = `<input type="checkbox" class="rowCheckbox" data-id="${item.part_no}" style="margin-left: 35%">`;
                cellPartNo.textContent = item.part_no;
                cellName.textContent = item.name;
                cellQuantity.textContent = item.quantity;
                cellUnit.textContent = item.unit;
                cellCGST.textContent = item.c_gst;
                cellSGST.textContent = item.s_gst;
                cellIGST.textContent = item.i_gst;
                cellPrice.textContent = item.price;
                cellActions.innerHTML = `
                    <i class="lni lni-pencil" onclick="editRow(${item.part_no})" style="padding-right: 2px"></i>
                    <i class="lni lni-trash-can" onclick="deleteRow(${item.part_no})" style="padding-left: 2px"></i>
                `;
                cellActions.className = "actions-column";

                // Check if this row's checkbox should be initially checked based on stored selection
                if (selectedItems.includes(item.part_no)) {
                    cellCheckbox.firstChild.checked = true;
                }
            });
        }

        function setupPagination(pagination) {
            const paginationDiv = document.getElementById('pagination');

            // Clear existing buttons
            paginationDiv.innerHTML = '';

            const prevButton = document.createElement('button');
            prevButton.innerHTML = '<i class="peepo lni lni-chevron-left"></i>';
            if (pagination.page > 1) {
                prevButton.onclick = () => fetchData(pagination.page - 1, currentSortBy, currentSortOrder);
                prevButton.classList.remove('disabled');
            } else {
                prevButton.classList.add('disabled');
            }
            paginationDiv.appendChild(prevButton);

            const pageNumber = document.createElement('span');
            pageNumber.className = 'page-number';
            pageNumber.textContent = `Page ${pagination.page} of ${pagination.total_pages}`;
            paginationDiv.appendChild(pageNumber);

            const nextButton = document.createElement('button');
            nextButton.innerHTML = '<i class="peepo lni lni-chevron-right"></i>';
            if (pagination.page < pagination.total_pages) {
                nextButton.onclick = () => fetchData(pagination.page + 1, currentSortBy, currentSortOrder);
                nextButton.classList.remove('disabled');
            } else {
                nextButton.classList.add('disabled');
            }
            paginationDiv.appendChild(nextButton);
        }

        function handleCheckboxClick(checkbox) {
            const itemId = checkbox.getAttribute('data-id');

            if (checkbox.checked && !selectedItems.includes(itemId)) {
                selectedItems.push(itemId); // Add item ID to selectedItems if checkbox is checked
            } else if (!checkbox.checked) {
                selectedItems = selectedItems.filter(item => item !== itemId); // Remove item ID if checkbox is unchecked
            }
        }

        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const rowCheckboxes = document.querySelectorAll('.rowCheckbox');

            rowCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
                handleCheckboxClick(checkbox); // Call handleCheckboxClick for each checkbox
            });
        }

        document.addEventListener('change', function (event) {
            if (event.target.classList.contains('rowCheckbox')) {
                handleCheckboxClick(event.target); // Call handleCheckboxClick for individual checkboxes
            }
        });

        function sortTable(header) {
            const sortBy = header.getAttribute('data-sort-by');
            if (currentSortBy === sortBy) {
                // Toggle sort order
                sortOrders[sortBy] = sortOrders[sortBy] === 'asc' ? 'desc' : 'asc';
            } else {
                // Set new sort column and default to ascending
                currentSortBy = sortBy;
                sortOrders[currentSortBy] = 'asc';
            }
            currentSortOrder = sortOrders[currentSortBy];
            fetchData(currentPage, currentSortBy, currentSortOrder);
        }

        function updateSortIcons() {
            const headers = document.querySelectorAll('th[data-sort-by]');
            headers.forEach(header => {
                const sortBy = header.getAttribute('data-sort-by');
                const sortIconElem = header.querySelector('.sort-icon');

                // Remove 'active' class and set all icons to default state
                sortIconElem.innerHTML = `
            <i class="lni lni-chevron-up"></i>
        `;
                sortIconElem.classList.remove('active');

                // Set active state and apply blue border
                if (sortBy === currentSortBy) {
                    const icon = currentSortOrder === 'asc' ? '<i class="lni lni-chevron-up"></i>' : '<i class="lni lni-chevron-down"></i>';
                    sortIconElem.innerHTML = icon;
                    sortIconElem.classList.add('active');
                }
            });
        }

        function editRow(partNo) {
            // Fetch data for the selected part number
            fetch(`/api/v1/product/${partNo}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Populate modal form fields with fetched data
                    document.getElementById('materialName').value = data.name;
                    document.getElementById('materialQuantity').value = data.quantity;
                    document.getElementById('materialUnit').setAttribute('value', data.unit);
                    document.getElementById('materialCGST').value = data.c_gst;
                    document.getElementById('materialSGST').value = data.s_gst;
                    document.getElementById('materialIGST').value = data.i_gst;
                    document.getElementById('materialPrice').value = data.price;

                    // Disable the unit dropdown
                    document.getElementById('materialName').disabled = true;
                    document.getElementById('materialUnit').disabled = true;

                    // Store part no for PUT request
                    editPartNo = partNo;

                    // Change modal title and button label for editing
                    document.getElementById('addMaterialModalLabel').textContent = 'Edit Product';
                    document.getElementById('submitBtn').textContent = 'Update Product';

                    // Show the modal
                    openEditModal();
                })
                .catch(error => console.error('Error fetching material details:', error));
        }


        // Function to open Bootstrap modal for editing
        function openEditModal() {
            const modal = new bootstrap.Modal(document.getElementById('addMaterialModal'));
            modal.show();
        }


        async function deleteRow(partNo) {
            if (confirm(`Are you sure you want to delete part no ${partNo}?`)) {
                try {
                    await fetch(`/api/v1/product/${partNo}`, {
                        method: 'DELETE',
                    });
                    fetchData(currentPage, currentSortBy, currentSortOrder);
                } catch (error) {
                    console.error('Error deleting row:', error);
                }
            }
        }

        // Function to open Bootstrap modal for adding new material
        function openModal() {
            const modal = new bootstrap.Modal(document.getElementById('addMaterialModal'));
            modal.show();

            // Clear form fields and reset modal properties
            document.getElementById('addMaterialForm').reset(); // Clear form fields
            document.getElementById('materialName').disabled = false;
            document.getElementById('materialUnit').disabled = false; // Enable the unit dropdown
            editPartNo = null; // Reset editPartNo
            document.getElementById('addMaterialModalLabel').textContent = 'Add New Product'; // Reset modal title
            document.getElementById('submitBtn').textContent = 'Add Product'; // Reset submit button label
        }

        // Function to close Bootstrap modal and reset its state
        function closeModal() {
            const modalElement = document.getElementById('addMaterialModal');
            const modal = bootstrap.Modal.getInstance(modalElement); // Get the instance of the modal
            modal.hide(); // Hide the modal using Bootstrap's hide method

            // Reset form fields and modal properties
            document.getElementById('addMaterialForm').reset(); // Reset form fields
            document.getElementById('materialUnit').disabled = false; // Enable the unit dropdown
            editPartNo = null; // Reset editPartNo
            document.getElementById('addMaterialModalLabel').textContent = 'Add New Product'; // Reset modal title
            document.getElementById('submitBtn').textContent = 'Add Product'; // Reset submit button label
        }

        document.getElementById('addMaterialModal').addEventListener('hidden.bs.modal', function () {
            // Reset form fields and modal properties
            document.getElementById('addMaterialForm').reset(); // Reset form fields
            document.getElementById('materialUnit').disabled = false; // Enable the unit dropdown
            editPartNo = null; // Reset editPartNo
            document.getElementById('addMaterialModalLabel').textContent = 'Add New Material'; // Reset modal title
            document.getElementById('submitBtn').textContent = 'Add Material'; // Reset submit button label
        }
        );

        async function deleteSelected() {
            if (selectedItems.length === 0) {
                alert('No rows selected');
                return;
            }

            if (confirm(`Are you sure you want to delete selected rows?`)) {
                try {
                    await Promise.all(selectedItems.map(partNo =>
                        fetch(`/api/v1/product/${partNo}`, {
                            method: 'DELETE',
                        })
                    ));
                    selectedItems = []; // Clear selectedItems array after successful deletion
                    fetchData(currentPage, currentSortBy, currentSortOrder); // Refresh data table after deletion
                } catch (error) {
                    console.error('Error deleting selected rows:', error);
                }
            }
        }

        // Function to handle form submission for both add and edit
        document.getElementById('addMaterialForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const name = formData.get('name');
            const quantity = parseInt(formData.get('quantity'));
            const unit = formData.get('unit');
            const c_gst = parseFloat(formData.get('c_gst'));
            const s_gst = parseFloat(formData.get('s_gst'));
            const i_gst = parseFloat(formData.get('i_gst'));
            const price = parseFloat(formData.get('price'));

            // Validate quantity and price are valid numbers
            if (isNaN(quantity) || quantity <= 0) {
                alert('Quantity must be a positive integer.');
                return;
            }
            if (isNaN(price) || price <= 0) {
                alert('Price must be a positive number.');
                return;
            }

            const data = {
                name: name,
                quantity: quantity,
                unit: unit,
                c_gst: c_gst,
                s_gst: s_gst,
                i_gst: i_gst,
                price: price,
            };

            const edit_data = {
                quantity: quantity,
                c_gst: c_gst,
                s_gst: s_gst,
                i_gst: i_gst,
                price: price,
            };

            try {
                if (editPartNo) {
                    // If editPartNo is set, send a PUT request to update the material
                    await fetch(`/api/v1/product/${editPartNo}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(edit_data),
                    });
                    editPartNo = null; // Reset editPartNo after successful update
                } else {
                    // Otherwise, it's a POST request to add new material
                    await fetch('/api/v1/product', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });
                }
                closeModal(); // Close modal on successful submission
                fetchData(currentPage, currentSortBy, currentSortOrder); // Fetch updated data
            } catch (error) {
                console.error('Error adding/updating material:', error);
            }
        });

        // Fetch initial data
        fetchData(currentPage);

    </script>
{% endblock %}
