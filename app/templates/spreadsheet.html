<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spreadsheet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/handsontable.full.min.css') }}">
</head>
<body>
    <div id="hot"></div>

   <script src="{{ url_for('static', filename='js/handsontable.full.min.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var data = {{ tables|tojson }};
    var container = document.getElementById('hot');
    var hot = new Handsontable(container, {
        data: data, // Use the data directly
        licenseKey: 'non-commercial-and-evaluation',
        rowHeaders: true,
        colHeaders: ['Date', 'Quantity Used', 'Raw Material Name'],
        // Add your column headers based on what 'to_dict' outputs
        // Other configurations...
        afterChange: function(changes, source) {
            if (!changes || source === 'loadData') {
                return;
            }
            fetch('/update-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    changes: changes
                }),
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }
    });
});
</script>

</body>
</html>
