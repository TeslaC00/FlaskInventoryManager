<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/handsontable.full.min.css') }}">
</head>
<body>
<div class="container-fluid" style="margin-left: -15px; margin-right: -15px;">
    <div class="row">
        <div class="col-2">
            <nav class="navbar bg-dark navbar-dark" style="height: 100vh; align-items: flex-start;text-align: center">
                <div class="container-fluid" style="flex-direction: column">
                    <a class="navbar-brand nav-link" href="/" style="font-size: 35px; margin-left: .5rem">Dashboard</a>
                    <ul class="navbar-nav" style="font-size: 20px">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/index/">Inventory</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/analysis/">Analysis</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/orders/">Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Account</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="col-10">
            <nav class="navbar">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search" aria-label="Search"
                           aria-describedby="basic-addon1">
                </div>
            </nav>
            <div class="container" style="align-items: center;margin-top: 50px; margin-left: -7px;">
                <div id="hot"></div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/handsontable.full.min.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var data = {{ tables|tojson }};
        var container = document.getElementById('hot');
        var hot = new Handsontable(container, {
            data: [data],
            licenseKey: 'non-commercial-and-evaluation',
            rowHeaders: true,
            colHeaders: ['Tables in Database'],
            // Other configurations...
            afterChange: function (changes, source) {
                if (!changes || source === 'loadData') {
                    // Don't send this change (it's a data load or no changes)
                    return;
                }
                // changes is an array of changes,
                // where each change is [row, prop, oldVal, newVal]
                fetch('/update-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        changes: changes
                    }),
                })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Success:', data);
                    })
                    .catch((error) => {
                        console.error('Error:', error);
                    });
            }
        });
    });
</script>

</body>
</html>
