<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Materials</title>
    <link rel="stylesheet" , href="{{ url_for('static',filename='css/wuxia.css') }}">
</head>
<body>
<h1>Raw Materials</h1>
<table>
    <tr>
        <th>Raw Material</th>
        <th>Unit</th>
        <th>Quantity</th>
    </tr>
    {% for material in materials %}
        <tr>
            <td>{{ material.raw_material_name }}</td>
            <td>{{ material.unit_type }}</td>
            <td>{{ material.quantity }}</td>
        </tr>
    {% endfor %}
</table>
</body>
</html>
