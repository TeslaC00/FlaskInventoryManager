{% extends "base.html" %}
{% block head %}
<title>Sales Form</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css" rel="stylesheet">

{% endblock %}

{% block content %}



    <!-- jQuery Full Version -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- jQuery UI -->
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>



<div class="container-fluid">




        <div class="container mt-5">
            <!-- Form -->
            <div class="col-md-9 ml-sm-auto col-lg-10 px-md-4">
                <div class="card">
                    <div class="card-header">
                        Sales Form
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="gstNo">GST No</label>
                                    <input type="text" class="form-control" id="gstNo" placeholder="GST No">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="date">Date</label>
                                    <input type="date" class="form-control" id="date">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label for="billNo">Bill No</label>
                                    <input type="text" class="form-control" id="billNo" placeholder="Bill No">
                                </div>
                            </div>

                            <!-- Dynamic Items Section -->
                            <div id="itemsSection">
                                <!-- Items will be added here dynamically -->
                            </div>
                            <button type="button" class="btn btn-secondary mb-2" onclick="addItem()">Add Item</button>

                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label for="totalBeforeTax">Total Before Tax</label>
                                    <input type="number" class="form-control" id="totalBeforeTax"
                                           placeholder="Total Before Tax" readonly>
                                </div>
                                <div class="form-group col-md-2">
                                    <label for="sgst">SGST (%)</label>
                                    <input type="number" class="form-control" id="sgst" placeholder="SGST"
                                           oninput="calculateTax()">
                                </div>
                                <div class="form-group col-md-2">
                                    <label for="cgst">CGST (%)</label>
                                    <input type="number" class="form-control" id="cgst" placeholder="CGST"
                                           oninput="calculateTax()">
                                </div>
                                <div class="form-group col-md-2">
                                    <label for="igst">IGST (%)</label>
                                    <input type="number" class="form-control" id="igst" placeholder="IGST"
                                           oninput="calculateTax()">
                                </div>
                                <div class="form-group col-md-2">
                                    <label for="totalAfterTax">Total After Tax</label>
                                    <input type="number" class="form-control" id="totalAfterTax"
                                           placeholder="Total After Tax" readonly>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}


    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script>
    let itemCount = 0;

    $(document).ready(function() {
        initializeAutocomplete(".item"); // Initialize autocomplete for existing items (if any)
    });

    function addItem() {
        itemCount++;
        const itemHTML = `
            <div class="form-row" id="itemRow${itemCount}">
                <div class="form-group col-md-4">
                    <input type="text" class="form-control item" placeholder="Item" id="item${itemCount}">
                </div>
                <div class="form-group col-md-4">
                    <input type="number" class="form-control rate" placeholder="Rate" id="rate${itemCount}" oninput="calculateTotalBeforeTax()">
                </div>
                <div class="form-group col-md-3">
                    <input type="number" class="form-control quantity" placeholder="Quantity" id="quantity${itemCount}" oninput="calculateTotalBeforeTax()">
                </div>
                <div class="col-md-1">
                    <button type="button" class="btn btn-danger" onclick="removeItem(${itemCount})">Remove</button>
                </div>
            </div>`;
        $('#itemsSection').append(itemHTML);
        initializeAutocomplete(`#item${itemCount}`); // Initialize autocomplete for the new item
    }

    function removeItem(itemId) {
        $(`#itemRow${itemId}`).remove();
        calculateTotalBeforeTax(); // Recalculate totals after item removal
    }

    function initializeAutocomplete(selector) {
    var debounceTimer;
    $(selector).autocomplete({
        source: function(request, response) {
            if (debounceTimer) {
                clearTimeout(debounceTimer);
            }
            debounceTimer = setTimeout(function() {
                $.getJSON("/autocomplete", { q: request.term }, function(data) {
                    response($.map(data.matching_results, function(item) {
                        return {
                            // Return the item name without adding <strong> tags
                            label: item.name, // No highlight
                            value: item.name
                        };
                    }));
                });
            }, 300); // Adjust debounce time as needed
        },
        minLength: 2,
        select: function(event, ui) {
            console.log("Selected: " + ui.item.value);
        }
    }).on("autocompletecreate", function() {
        $(this).data("ui-autocomplete")._renderItem = function(ul, item) {
            return $("<li>")
                .append($("<div>").text(item.label)) // Use jQuery's .text() to safely render text
                .appendTo(ul);
        };
    });
}


        function calculateTotalBeforeTax() {
            let totalBeforeTax = 0;
            document.querySelectorAll('.form-row').forEach(itemRow => {
                const rate = itemRow.querySelector('.rate')?.value || 0;
                const quantity = itemRow.querySelector('.quantity')?.value || 0;
                totalBeforeTax += rate * quantity;
            });
            document.getElementById('totalBeforeTax').value = totalBeforeTax.toFixed(2);
            calculateTax();
        }

        function calculateTax() {
            const totalBeforeTax = parseFloat(document.getElementById('totalBeforeTax').value) || 0;
            const sgst = parseFloat(document.getElementById('sgst').value) || 0;
            const cgst = parseFloat(document.getElementById('cgst').value) || 0;
            const igst = parseFloat(document.getElementById('igst').value) || 0;
            const taxTotal = totalBeforeTax * (sgst + cgst + igst) / 100;
            document.getElementById('totalAfterTax').value = (totalBeforeTax + taxTotal).toFixed(2);
        }
    </script>


    <!-- JavaScript and jQuery scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        // All your JavaScript code
        $(document).ready(function () {
            $('.toggle-sidebar').click(function () {
                $('.sidebar').toggleClass('active');
            });
        });
    </script>
    <script>
        // Add autocomplete functionality for dynamically added items
       $(document).ready(function() {
    var debounceTimer;
    $(".item").each(function() {
        $(this).autocomplete({
            source: function(request, response) {
                if (debounceTimer) {
                    clearTimeout(debounceTimer);
                }
                debounceTimer = setTimeout(function() {
                    $.getJSON("/autocomplete", { q: request.term }, function(data) {
                        response($.map(data.matching_results, function(item) {
                            return {
                                label: item.name.replace(new RegExp(request.term, "gi"), (match) => `<strong>${match}</strong>`), // Highlight matching part
                                value: item.name
                            };
                        }));
                    });
                }, 300); // Adjust debounce time as needed
            },
            minLength: 2,
            select: function(event, ui) {
                console.log("Selected: " + ui.item.value);
            }
        }).on("autocompletecreate", function() {
            $(this).data("ui-autocomplete")._renderItem = function(ul, item) {
                return $("<li>")
                    .append($("<div>").html(item.label)) // Use jQuery's .html() to render HTML
                    .appendTo(ul);
            };
        });
    });
});


    </script>
    {% endblock %}
