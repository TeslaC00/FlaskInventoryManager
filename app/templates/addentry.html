{% extends "base.html" %}

{% block head %}
    <title>Purchase Form</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css" rel="stylesheet">
{% endblock %}

{% block content %}
    <div class="container-fluid">
        <div class="container mt-5">
            <!-- Form -->
            <div class="col-md-9 ml-sm-auto col-lg-10 px-md-4">
                <div class="card">
                    <div class="card-header">
                        Purchase
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="supplier id">Supplier ID</label>
                                    <input type="text" class="form-control" id="Supplier ID" placeholder="Supplier ID">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="supplier name">Supplier Name</label>
                                    <input type="text" class="form-control" id="supplier name" placeholder="Supplier Name">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">

                                    <label for="challan no">Challan No.</label>
                                    <input type="number" class="form-control" id="challan no" placeholder="Challan No.">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="date">Date</label>
                                    <input type="date" class="form-control" id="date" placeholder="date">
                                </div>
                            </div>

                            <!-- Dynamic Items Section -->
                            <div id="itemsSection">
                                <!-- Items will be added here dynamically -->
                            </div>

                            <button type="button" class="btn btn-secondary mb-2" onclick="addItem()">Add Raw Material</button>

                            <div class="form-row col-md-12">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}

{% block scripts %}
    <!-- jQuery Full Version -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- jQuery UI -->
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>

        <!-- JavaScript and jQuery scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        let itemCount = 0;
        $(document).ready(function() {
            // Initialize autocomplete for existing items (if any)
            initializeAutocomplete(".item");
        });

        function addItem() {
            itemCount++;
            const itemHTML = `
                <div class="form-row" id="RawRow${itemCount}">
                    <div class="form-group col-md-4">
                        <input type="text" class="form-control item" placeholder="Raw Material" id="raw${itemCount}">
                    </div>
                    <div class="form-group col-md-3">
                        <input type="number" class="form-control rate" placeholder="Price" id="price${itemCount}">
                    </div>
                    <div class="form-group col-md-3">
                        <input type="number" class="form-control quantity" placeholder="Quantity" id="quantity${itemCount}">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger" onclick="removeItem(${itemCount})">Remove</button>
                    </div>
                </div>`;
            $('#itemsSection').append(itemHTML);
            initializeAutocomplete(`#item${itemCount}`); // Initialize autocomplete for the new item
        }

        function removeItem(itemId) {
            $(`#RawRow${itemId}`).remove();
            // Recalculate totals after item removal
            calculateTotalBeforeTax();
        }

        function initializeAutocomplete(selector) {
            let debounceTimer;
            $(selector).autocomplete({
                source: function(request, response) {
                    if (debounceTimer) {
                        clearTimeout(debounceTimer);
                    }
                    debounceTimer = setTimeout(function() {
                        $.getJSON("/autocomplete_raw", { q: request.term }, function(data) {
                            response($.map(data.matching_results, function(raw) {
                                return {
                                // Return the item name without adding <strong> tags
                                label: raw.name.replace(new RegExp(request.term, "gi"), (match) => `<strong>${match}</strong>`), // No highlight
                                value: raw.name
                            };
                        }));
                        });
                        }, 300); // Adjust debounce time as needed
                },
                minLength: 2,
                select: function(event, ui) {
                    console.log("Selected: " + ui.raw.value);
                }
            }).on("autocompletecreate", function() {
                $(this).data("ui-autocomplete")._renderItem = function(ul, item) {
                    return $("<li>")
                    .append($("<div>").text(item.label)) // Use jQuery's .text() to safely render text
                    .appendTo(ul);
                };
            });
        }

        function calculateTotalBeforeTax() {
            let totalBeforeTax = 0;
            document.querySelectorAll('.form-row').forEach(itemRow => {
                const rate = itemRow.querySelector('.rate')?.value || 0;
                const quantity = itemRow.querySelector('.quantity')?.value || 0;
                totalBeforeTax += rate * quantity;
            });
            document.getElementById('totalBeforeTax').value = totalBeforeTax.toFixed(2);
            calculateTax();
        }

        function calculateTax() {
            const totalBeforeTax = parseFloat(document.getElementById('totalBeforeTax').value) || 0;
            const sgst = parseFloat(document.getElementById('sgst').value) || 0;
            const cgst = parseFloat(document.getElementById('cgst').value) || 0;
            const igst = parseFloat(document.getElementById('igst').value) || 0;
            const taxTotal = totalBeforeTax * (sgst + cgst + igst) / 100;
            document.getElementById('totalAfterTax').value = (totalBeforeTax + taxTotal).toFixed(2);
        }
    </script>

{% endblock %}
