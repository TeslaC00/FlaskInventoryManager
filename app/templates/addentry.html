{% extends "base.html" %}

{% block head %}
    <title>Purchase Form</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css" rel="stylesheet">
{% endblock %}

{% block content %}
    <div class="container-fluid">
        <div class="container mt-5">
            <!-- Form -->
            <div class="col-md-9 ml-sm-auto col-lg-10 px-md-4">
                <div class="card">
                    <div class="card-header">
                        Purchase
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="supplier id">Supplier ID</label>
                                    <input type="text" class="form-control" id="Supplier ID" placeholder="Supplier ID">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="supplier name">Supplier Name</label>
                                    <input type="text" class="form-control" id="supplier name" placeholder="Supplier Name">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">

                                    <label for="challan no">Challan No.</label>
                                    <input type="number" class="form-control" id="challan no" placeholder="Challan No.">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="date">Date</label>
                                    <input type="date" class="form-control" id="date" placeholder="date">
                                </div>
                            </div>

                            <!-- Dynamic Items Section -->
                            <div id="itemsSection">
                                <!-- Items will be added here dynamically -->
                            </div>

                            <button type="button" class="btn btn-secondary mb-2" onclick="addItem()">Add Raw Material</button>

                            <div class="form-row col-md-12">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}

{% block scripts %}
    <!-- Optimize script imports -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        let itemCount = 0;

        $(document).ready(function() {
            // Toggle sidebar
            $('.toggle-sidebar').click(function() {
                $('.sidebar').toggleClass('active');
            });

            // Add item functionality
            function addItem() {
                itemCount++;
                const itemHTML = `
                    <div class="form-row" id="RawRow${itemCount}">
                        <div class="form-group col-md-4">
                            <input type="text" class="form-control item" placeholder="Raw Material" id="raw${itemCount}">
                        </div>
                        <div class="form-group col-md-3">
                            <input type="number" class="form-control rate" placeholder="Price" id="price${itemCount}">
                        </div>
                        <div class="form-group col-md-3">
                            <input type="number" class="form-control quantity" placeholder="Quantity" id="quantity${itemCount}">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-danger" onclick="removeItem(${itemCount})">Remove</button>
                        </div>
                    </div>`;
                $('#itemsSection').append(itemHTML);
                initializeAutocomplete(`#raw${itemCount}`); // Fixed to correctly initialize new items
            }

            window.addItem = addItem; // Expose addItem to global scope to make it accessible for onclick events

            function removeItem(itemId) {
                $(`#RawRow${itemId}`).remove();
            }

            window.removeItem = removeItem; // Expose removeItem to global scope

            // Initialize autocomplete for existing and dynamically added items
            function initializeAutocomplete(selector) {
                $(selector).autocomplete({
                    source: function(request, response) {
                        $.getJSON("/autocomplete_raw", { q: request.term }, function(data) {
                            response($.map(data.matching_results, function(item) {
                                return {
                                    label: item.name, // Removed highlight for simplicity
                                    value: item.name
                                };
                            }));
                        });
                    },
                    minLength: 2
                });
            }

            // Initialize for existing items, if any. Example selector: ".item"
             initializeAutocomplete(".item");
        });
    </script>
{% endblock %}
