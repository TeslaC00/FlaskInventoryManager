{% extends "base.html" %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Data Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 25px;
            overflow: hidden;
            border-bottom: 5px solid grey;
        }

        th, td {
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th:first-child {
            border-top-left-radius: 25px;
        }

        th:last-child {
            border-top-right-radius: 25px;
        }

        tr:last-child td:first-child {
            border-bottom-left-radius: 25px;
        }

        tr:last-child td:last-child {
            border-bottom-right-radius: 25px;
        }

        th {
            background-color: #d0f0ff;
            cursor: pointer;
            position: relative;
        }

        th .sort-icon {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            padding-top: 5px;
        }

        .sort-icon.active {
            border: 1px solid blue; /* Add blue border */
            border-radius: 10px;
        }

        .checkbox-column {
            width: 5%;
            text-align: center;
            cursor: default;
        }

        .gst-no-column {
            width: 18%;
            cursor: default;
        }

        .name-column {
            width: 20%;
        }

        .state-code-column {
            width: 12%;
        }

        .state-name-column {
            width: 20%;
        }

        .address-column {
            width: 25%;
        }

        .actions-column {
            width: 5%;
            text-align: center;
            cursor: default;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination button {
            padding-top: 6px;
            margin: 0 5px;
            cursor: pointer;
            background: none;
            border: none;
            color: #0d6efd;
        }

        .pagination button.disabled {
            color: #c0c0c0;
            cursor: not-allowed;
        }

        .pagination .page-number {
            margin: 0;
            font-size: 16px;
        }

        .pagination i {
            font-size: 24px;
            cursor: pointer;
        }

        .actions-column i {
            font-size: 100%;
            cursor: pointer;
        }

        .lni-pencil {
            color: blue;
        }

        .lni-trash-can {
            color: red;
        }

        .actions-column i:hover {
            color: gray;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 2px solid gray;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .filter-container {
            display: flex;
            gap: 10px;
        }

        .filter-container input,
        .filter-container select,
        .filter-container button {
            outline: none;
            border: 1px solid gray;
            border-radius: 20px;
            padding: 5px;
        }

        .filter-container button {
            color: white;
            background-color: #17365a;
        }

        #stateCodeFilter {
            width: 60px;
        }

        .searchbar {
            border: 1px solid gray;
            border-radius: 25px;
        }

        .searchbar input {
            outline: none;
            border: 0;
            border-radius: 25px;
        }

        .searchbar select {
            width: 122px;
            outline: none;
            border: 0;
            border-left: 1px solid gray;
            margin-right: 5px;
        }

        .button-container button {
            padding: 5px 10px;
            margin-left: 10px;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
        }

        .button-container button {
            margin-left: 10px;
            padding: 5px 10px;
            cursor: pointer;
            background-color: #17365a;
            color: white;
            border: none;
            border-radius: 15px;
        }

        .button-container #addBtn:hover {
            transition: background-color 300ms;
            background-color: #63be63;
        }

        .button-container #delBtn:hover {
            transition: background-color 300ms;
            background-color: red;
        }

    </style>
{% endblock %}

{% block content %}
    <div class="container" style="margin-left: 30px">
        <h2>Supplier Data</h2>

        <!-- Wrapper for search bar and buttons -->
        <div class="top-bar">
            <div class="filter-container">
                <div class="searchbar">
                    <input type="text" id="searchInput" placeholder="Search by name... " oninput="fetchData(1)">
                </div>
                <input type="text" id="stateNameFilter" placeholder="State Name" oninput="fetchData(1)">
                <button onclick="clearFilters()">Clear Filters</button>
            </div>
            <div class="button-container">
                <button id="addBtn" onclick="openModal()">Add New Supplier</button>
                <button id="delBtn" onclick="deleteSelected()">Delete Selected</button>
            </div>
        </div>

        <table id="dataTable" class="table table-hover">
            <thead class="table-light" style="border-color: black; border-width: 2px">
            <tr>
                <th class="checkbox-column"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                <th class="gst-no-column">GST No.</th>
                <th class="name-column" data-sort-by="name" onclick="sortTable(this)">Name <span
                        class="sort-icon"></span>
                </th>
                <th class="state-code-column" data-sort-by="state_code" onclick="sortTable(this)">State Code <span
                        class="sort-icon"></span></th>
                <th class="state-name-column" data-sort-by="state_name" onclick="sortTable(this)">State Name <span
                        class="sort-icon"></span>
                </th>
                <th class="address-column" data-sort-by="address" onclick="sortTable(this)">Address <span
                        class="sort-icon"></span>
                </th>
                <th class="actions-column">Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Rows will be inserted here dynamically -->
            </tbody>
        </table>

        <div class="pagination" id="pagination">
            <!-- Pagination buttons will be inserted here dynamically -->
        </div>

        <!-- Add Buyer Modal -->
        <div class="modal fade" id="addBuyerModal" tabindex="-1" aria-labelledby="addBuyerModalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addBuyerModalLabel">Add New Supplier</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addBuyerForm">
                            <div class="mb-3">
                                <label for="buyerGSTNo" class="form-label">GST No.</label>
                                <input type="text" class="form-control" id="buyerGSTNo" name="gst_no" required>
                            </div>
                            <div class="mb-3">
                                <label for="buyerName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="buyerName" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="buyerStateCode" class="form-label">State Code</label>
                                <input type="number" class="form-control" id="buyerStateCode" name="state_code" required>
                            </div>
                            <div class="mb-3">
                                <label for="buyerStateName" class="form-label">State Name</label>
                                <input type="text" class="form-control" id="buyerStateName" name="state_name" required>
                            </div>
                            <div class="mb-3">
                                <label for="buyerAddress" class="form-label">Address</label>
                                <textarea class="form-control" id="buyerAddress" name="address" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary" id="submitBtn">Add Supplier</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentSortBy = 'name';
        let currentSortOrder = 'asc';
        let sortOrders = { 'gst_no': 'asc', 'name': 'asc', 'state_code': 'asc', 'state_name': 'asc', 'address': 'asc' };
        let editBuyerId = null;
        let selectedItems = [];

        document.addEventListener('DOMContentLoaded', function () {
            fetchData(currentPage);
        });

        async function fetchData(page, sortBy = 'name', sortOrder = 'asc') {
            try {
                const searchQuery = document.getElementById('searchInput').value;
                const stateNameFilter = document.getElementById('stateNameFilter').value;

                const queryParams = new URLSearchParams({
                    sort_order: sortOrder,
                    sort_by: sortBy,
                    page: page,
                    page_size: 11,
                });

                if (searchQuery) {
                    queryParams.append('search', searchQuery);
                }
                if (stateNameFilter) {
                    queryParams.append('state_name', stateNameFilter);
                }

                const response = await fetch(`/api/v1/supplier?${queryParams.toString()}`);
                const data = await response.json();
                const pagination = JSON.parse(response.headers.get('x-pagination'));

                populateTable(data);
                setupPagination(pagination);
                updateSortIcons();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('stateNameFilter').value = '';
            fetchData(1);
        }

        function populateTable(data) {
            const tableBody = document.getElementById('dataTable').getElementsByTagName('tbody')[0];
            tableBody.innerHTML = '';

            data.forEach(buyer => {
                const row = tableBody.insertRow();
                const cellCheckbox = row.insertCell(0);
                const cellGstNo = row.insertCell(1);
                const cellName = row.insertCell(2);
                const cellStateCode = row.insertCell(3);
                const cellStateName = row.insertCell(4);
                const cellAddress = row.insertCell(5);
                const cellActions = row.insertCell(6);

                cellCheckbox.innerHTML = `<input type="checkbox" class="rowCheckbox" data-id="${buyer.id}" style="margin-left: 35%">`;
                cellGstNo.textContent = buyer.GST_No;
                cellName.textContent = buyer.name;
                cellStateCode.textContent = buyer.state_code;
                cellStateName.textContent = buyer.state_name;
                cellAddress.textContent = buyer.address;
                cellActions.innerHTML = `
                    <i class="lni lni-pencil" onclick="editBuyer(${buyer.id})" style="padding-right: 2px"></i>
                    <i class="lni lni-trash-can" onclick="deleteBuyer(${buyer.id})" style="padding-left: 2px"></i>
                `;
                cellActions.className = "actions-column";

                if (selectedItems.includes(buyer.id)) {
                    cellCheckbox.firstChild.checked = true;
                }
            });
        }

        function setupPagination(pagination) {
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = '';

            const prevButton = document.createElement('button');
            prevButton.innerHTML = '<i class="peepo lni lni-chevron-left"></i>';
            if (pagination.page > 1) {
                prevButton.onclick = () => fetchData(pagination.page - 1, currentSortBy, currentSortOrder);
                prevButton.classList.remove('disabled');
            } else {
                prevButton.classList.add('disabled');
            }
            paginationDiv.appendChild(prevButton);

            const pageNumber = document.createElement('span');
            pageNumber.className = 'page-number';
            pageNumber.textContent = `Page ${pagination.page} of ${pagination.total_pages}`;
            paginationDiv.appendChild(pageNumber);

            const nextButton = document.createElement('button');
            nextButton.innerHTML = '<i class="peepo lni lni-chevron-right"></i>';
            if (pagination.page < pagination.total_pages) {
                nextButton.onclick = () => fetchData(pagination.page + 1, currentSortBy, currentSortOrder);
                nextButton.classList.remove('disabled');
            } else {
                nextButton.classList.add('disabled');
            }
            paginationDiv.appendChild(nextButton);
        }

        function handleCheckboxClick(checkbox) {
            const itemId = checkbox.getAttribute('data-id');

            if (checkbox.checked && !selectedItems.includes(itemId)) {
                selectedItems.push(itemId);
            } else if (!checkbox.checked) {
                selectedItems = selectedItems.filter(item => item !== itemId);
            }
        }

        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const rowCheckboxes = document.querySelectorAll('.rowCheckbox');

            rowCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
                handleCheckboxClick(checkbox);
            });
        }

        document.addEventListener('change', function (event) {
            if (event.target.classList.contains('rowCheckbox')) {
                handleCheckboxClick(event.target);
            }
        });

        function sortTable(header) {
            const sortBy = header.getAttribute('data-sort-by');
            if (currentSortBy === sortBy) {
                sortOrders[sortBy] = sortOrders[sortBy] === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortBy = sortBy;
                sortOrders[currentSortBy] = 'asc';
            }
            currentSortOrder = sortOrders[currentSortBy];
            fetchData(currentPage, currentSortBy, currentSortOrder);
        }

        function updateSortIcons() {
            const headers = document.querySelectorAll('th[data-sort-by]');
            headers.forEach(header => {
                const sortBy = header.getAttribute('data-sort-by');
                const sortIconElem = header.querySelector('.sort-icon');

                sortIconElem.innerHTML = `
                    <i class="lni lni-chevron-up"></i>
                `;
                sortIconElem.classList.remove('active');

                if (sortBy === currentSortBy) {
                    const icon = currentSortOrder === 'asc' ? '<i class="lni lni-chevron-up"></i>' : '<i class="lni lni-chevron-down"></i>';
                    sortIconElem.innerHTML = icon;
                    sortIconElem.classList.add('active');
                }
            });
        }

        function editBuyer(id) {
            fetch(`/api/v1/supplier/${id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('buyerGSTNo').setAttribute('value',  data.GST_No);
                    document.getElementById('buyerName').value = data.name;
                    document.getElementById('buyerStateCode').value = data.state_code;
                    document.getElementById('buyerStateName').value = data.state_name;
                    document.getElementById('buyerAddress').value = data.address;

                    document.getElementById('buyerGSTNo').disabled = true;

                    editBuyerId = id;

                    document.getElementById('addBuyerModalLabel').textContent = 'Edit Supplier';
                    document.getElementById('submitBtn').textContent = 'Update Supplier';

                    openEditModal();
                })
                .catch(error => console.error('Error fetching buyer details:', error));
        }

        function openEditModal() {
            const modal = new bootstrap.Modal(document.getElementById('addBuyerModal'));
            modal.show();
        }

        async function deleteBuyer(id) {
            if (confirm(`Are you sure you want to delete this buyer?`)) {
                try {
                    await fetch(`/api/v1/supplier/${id}`, {
                        method: 'DELETE',
                    });
                    fetchData(currentPage, currentSortBy, currentSortOrder);
                } catch (error) {
                    console.error('Error deleting buyer:', error);
                }
            }
        }

        function openModal() {
            const modal = new bootstrap.Modal(document.getElementById('addBuyerModal'));
            modal.show();

            document.getElementById('addBuyerForm').reset();
            document.getElementById('buyerGSTNo').disabled = false;
            document.getElementById('buyerGSTNo').setAttribute('value', '');
            editBuyerId = null;
            document.getElementById('addBuyerModalLabel').textContent = 'Add New Supplier';
            document.getElementById('submitBtn').textContent = 'Add Supplier';
        }

        function closeModal() {
            const modalElement = document.getElementById('addBuyerModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            modal.hide();

            document.getElementById('addBuyerForm').reset();
            editBuyerId = null;
            document.getElementById('addBuyerModalLabel').textContent = 'Add New Buyer';
            document.getElementById('submitBtn').textContent = 'Add Buyer';
        }

        document.getElementById('addBuyerModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('addBuyerForm').reset();
            editBuyerId = null;
            document.getElementById('addBuyerModalLabel').textContent = 'Add New Buyer';
            document.getElementById('submitBtn').textContent = 'Add Buyer';
        });

        document.getElementById('addBuyerForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const formData = new FormData(this);

            const data = {
                gst_no: formData.get('GST_No'),
                name: formData.get('name'),
                state_code: formData.get('state_code'),
                state_name: formData.get('state_name'),
                address: formData.get('address')
            };

            try {
                if (editBuyerId) {
                    // If editBuyerId is set, send a PUT request to update the buyer
                    await fetch(`/api/v1/supplier/${editBuyerId}`, {
                        method: 'PUT',
                        body: JSON.stringify(data),
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    editBuyerId = null;
                } else {
                    // Otherwise, it's a POST request to add new buyer
                    await fetch('/api/v1/supplier', {
                        method: 'POST',
                        body: JSON.stringify(data),
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                }
                closeModal();
                fetchData(currentPage);
            } catch (error) {
                console.error('Error adding/updating buyer:', error);
            }
        });

        async function deleteSelected() {
            if (selectedItems.length === 0) {
                alert('No rows selected');
                return;
            }

            if (confirm(`Are you sure you want to delete selected buyers?`)) {
                try {
                    await Promise.all(selectedItems.map(id =>
                        fetch(`/api/v1/supplier/${id}`, {
                            method: 'DELETE'
                        })
                    ));
                    selectedItems = [];
                    fetchData(currentPage);
                } catch (error) {
                    console.error('Error deleting selected buyers:', error);
                }
            }
        }

        function updateSortIcons() {
            const headers = document.querySelectorAll('th[data-sort-by]');
            headers.forEach(header => {
                const sortBy = header.getAttribute('data-sort-by');
                const sortIconElem = header.querySelector('.sort-icon');

                sortIconElem.innerHTML = `
                    <i class="lni lni-chevron-up"></i>
                `;
                sortIconElem.classList.remove('active');

                if (sortBy === currentSortBy) {
                    const icon = currentSortOrder === 'asc' ? '<i class="lni lni-chevron-up"></i>' : '<i class="lni lni-chevron-down"></i>';
                    sortIconElem.innerHTML = icon;
                    sortIconElem.classList.add('active');
                }
            });
        }
    </script>


{% endblock %}
