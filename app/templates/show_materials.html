{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/table.css')}}">
    <title>Material Table</title>
{% endblock %}

{% block content %}
<div class="container">
    <h1>Material Table</h1>
    <a href="{{ url_for('material.add_material') }}" class="add-new-btn">Add New Material</a>
    <table>
        <thead>
            <tr>
                <th>Material Name</th>
                <th>Unit Type</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            {% for material in materials %}
            <tr>
                <td>{{ material.name }}</td>
                <td>{{ material.unit_type }}</td>
                <td>{{ material.quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
