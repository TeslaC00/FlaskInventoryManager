<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid" style="margin-left: -15px; margin-right: -15px;">
    <div class="row">
        <div class="col-2">
            <nav class="navbar bg-dark navbar-dark" style="height: 100vh; align-items: flex-start;text-align: center">
                <div class="container-fluid" style="flex-direction: column">
                    <a class="navbar-brand nav-link" href="/" style="font-size: 35px; margin-left: .5rem">Dashboard</a>
                    <ul class="navbar-nav" style="font-size: 20px">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/index/">Inventory</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/analysis/">Analysis</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/orders/">Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Account</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="col-10">
            <nav class="navbar">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search" aria-label="Search"
                           aria-describedby="basic-addon1">
                </div>
            </nav>
            <div class="container navbar-nav-scroll" style="align-items: center;margin-top: 50px; margin-left: -7px;">
                <table id="myTable" class="table table-dark table-striped table-bordered border-primary table-hover">
                    <thead class="sticky-top">
                    <tr>
                        {% for table in all_tables %}
                            <th scope="col">{{ table }}</th>
                        {% endfor %}
                    </tr>
                    </thead>
                    <tbody>
                    {% for item in items %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                            <td>{{ item }}</td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function filterTable() {
        var input, filter, table, tr, td, i, j, txtValue;
        input = document.getElementById("searchInput");
        filter = input.value.toUpperCase();
        table = document.getElementById("myTable");
        tr = table.getElementsByTagName("tr");

        for (i = 0; i < tr.length; i++) {
            var displayRow = false;
            td = tr[i].getElementsByTagName("td");

            for (j = 0; j < td.length; j++) {
                if (td[j]) {
                    txtValue = td[j].textContent || td[j].innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        displayRow = true;
                        break;
                    }
                }
            }

            for (j = 0; j < td.length; j++) {
                if (displayRow) {
                    td[j].style.display = "";
                } else {
                    td[j].style.display = "none";
                }
            }
        }
    }
    document.getElementById("searchInput").addEventListener("keyup", filterTable);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
